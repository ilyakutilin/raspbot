[project]
name = "raspbot"
version = "0.1.0"
description = ""
authors = [{name = "Ilya Kutilin", email = "ilyakutilin@yandex.ru"}]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "SQLAlchemy>=2.0.13,<3.0.0",
    "pydantic>=2.7.1,<3.0.0",
    "aiohttp>=3.8.4,<4.0.0",
    "aiodns>=3.0.0,<4.0.0",
    "aiolimiter>=1.1.0,<2.0.0",
    "asyncpg>=0.27.0,<0.28.0",
    "alembic>=1.11.1,<2.0.0",
    "aiogram>=3.5.0,<4.0.0",
    "async-property>=0.2.2,<0.3.0",
    "pre-commit>=3.7.0,<4.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-dateutil>=2.9.0",
    "apscheduler>=3.10.4,<4.0.0",
    "aiosmtplib>=3.0.1,<4.0.0",
    "types-python-dateutil>=2.9.0.20240316,<3.0.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0,<7.0.0",
    "isort>=5.12.0,<6.0.0",
    "pep8-naming>=0.13.3,<0.14.0",
    "flake8-return>=1.2.0,<2.0.0",
    "flake8-isort>=6.0.0,<7.0.0",
    "mypy>=1.3.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.black]
line-length = 88
